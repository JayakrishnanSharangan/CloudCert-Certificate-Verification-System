name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: '**/package-lock.json'

      - name: 3. Install & Test Backend
        run: |
          cd backend
          npm ci
          npm run lint
          npm test

      - name: 4. Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: 5. DevSecOps Dependency Audit
        run: |
          cd backend
          npm audit --audit-level=high || true

      - name: 6. Validate CloudFormation Template
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true
      - name: Validate CFN Syntax
        run: |
          python3 -c "import yaml; yaml.safe_load(open('cloudformation/template.yaml'))"
          echo "CloudFormation template is valid YAML!"

      - name: 7. Validate Terraform Infrastructure
        uses: hashicorp/setup-terraform@v3
      - run: |
          cd terraform
          terraform fmt -check
          terraform init -backend=false
          terraform validate
